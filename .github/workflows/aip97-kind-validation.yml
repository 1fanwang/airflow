---
name: Validate failure reporting on Kubernetes
run-name: Exercise the combined source on pinned upstream 63b615b25258
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - 1fannnw/aip97-66405-validation
    paths:
      - .github/workflows/aip97-kind-validation.yml
      - .github/aip97-runtime.patch
permissions:
  contents: read

jobs:
  kubernetes:
    name: Kubernetes ${{ matrix.candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: combined
            source-sha: 77b67ade969b160f7550437e6b5108926d3ecc15
    env:
      CANDIDATE: ${{ matrix.candidate }}
      SOURCE_SHA: ${{ matrix.source-sha }}
      PYTHON_VERSION: "3.12"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Check out the public validation instructions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - name: Check out the exact public source and its baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 1fanwang/airflow
          ref: ${{ matrix.source-sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install the repository's locked tooling and kind
        working-directory: source
        run: |
          UV_VERSION=$(sed -n '/^name = "uv"$/{n;s/^version = "\(.*\)"$/\1/p;}' uv.lock)
          test -n "$UV_VERSION"
          pip install "uv==$UV_VERSION"
          ./scripts/ci/install_breeze.sh
          uv run --project dev/breeze --locked python -c \
            "from airflow_breeze.utils.kubernetes_utils import _download_kind_if_needed; \
            _download_kind_if_needed()"
          uv run --project dev/breeze --locked python -c \
            "from airflow_breeze.utils.kubernetes_utils import KIND_BIN_PATH; \
            print(KIND_BIN_PATH.parent)" >> "$GITHUB_PATH"
      - name: Prepare the pinned public fixture
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C source rev-parse HEAD HEAD^{tree} | tee evidence/source.log
          git init fixture
          git -C fixture fetch --depth=1 \
            https://gist.github.com/ba08bdda0e5bfee365e11f3be8a8851d.git \
            76430f757954c822553cac97a30be20865d5a733
          git -C fixture checkout --detach FETCH_HEAD
          git -C fixture rev-parse HEAD | tee evidence/fixture-base.log
          git apply -p2 --check --directory=fixture control/.github/aip97-runtime.patch
          git apply -p2 --directory=fixture control/.github/aip97-runtime.patch
          cp control/.github/workflows/aip97-kind-validation.yml evidence/workflow.yml
          cp control/.github/aip97-runtime.patch evidence/fixture.patch
          cp fixture/run.py fixture/run_live.py fixture/probe.py fixture/listener.py \
            fixture/verify_evidence.py fixture/Dockerfile fixture/requirements.txt fixture/LICENSE evidence/
          sha256sum evidence/* > evidence/sha256.log
          uname -srm | tee evidence/runner.log
          nproc | tee -a evidence/runner.log
          free -h | tee -a evidence/runner.log
          kind version | tee -a evidence/runner.log
      - name: Run real workers and verify raw observations
        run: |
          set -euo pipefail
          flags=()
          if [[ "$CANDIDATE" == "combined" ]]; then
            flags+=(--policy)
          fi
          python fixture/run.py --source "$GITHUB_WORKSPACE/source" --commit "$SOURCE_SHA" \
            "${flags[@]}" 2>&1 | tee evidence/controller.log
          runs=(fixture/runs/*)
          test "${#runs[@]}" -eq 1
          python fixture/verify_evidence.py "${runs[0]}" --candidate "$SOURCE_SHA" \
            "${flags[@]}" 2>&1 | tee evidence/verification.log
      - name: Retain only fixture, source identity, and runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kubernetes-${{ matrix.candidate }}-${{ matrix.source-sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            evidence/
            fixture/runs/*/comparison.json
            fixture/runs/*/independent-verification.json
            fixture/runs/*/evidence-excerpts.log
            fixture/runs/*/fixture-manifest.json
            fixture/runs/*/*/commands.jsonl
            fixture/runs/*/*/commands.log
            fixture/runs/*/*/ownership.json
            fixture/runs/*/*/cleanup.json
            fixture/runs/*/*/runtime.log
            fixture/runs/*/*/db.log
            fixture/runs/*/*/kind-cleanup.log
            fixture/runs/*/*/build/source-manifest.json
            fixture/runs/*/*/runtime/result.json
            fixture/runs/*/*/runtime/process-cleanup.json
            fixture/runs/*/*/runtime/api.log
            fixture/runs/*/*/runtime/scheduler.log
            fixture/runs/*/*/runtime/dag-processor.log
            fixture/runs/*/*/runtime/migrate.log
            fixture/runs/*/*/runtime/evidence/
